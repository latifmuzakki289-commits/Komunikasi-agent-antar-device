<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-label="Tiga aliran data menyatu ke satu endpoint">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0d1428"/>
    </linearGradient>

    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fa8ff" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#4f7dff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4f7dff" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="blue" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1250" y2="0">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#4dabf7" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#9cc4ff"/>
    </linearGradient>

    <linearGradient id="green" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1250" y2="0">
      <stop offset="0" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="0.18" stop-color="#34d399" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>

    <linearGradient id="violet" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="1250" y2="0">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0"/>
      <stop offset="0.22" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#d6c6ff"/>
    </linearGradient>

    <linearGradient id="out" gradientUnits="userSpaceOnUse" x1="1246" y1="0" x2="1600" y2="0">
      <stop offset="0" stop-color="#eaf2ff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#eaf2ff" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#8aa2c8" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>
  <rect width="1600" height="500" fill="url(#grid)"/>
  <ellipse cx="1250" cy="250" rx="340" ry="240" fill="url(#core)"/>

  <g fill="none" stroke-linecap="round">
    <path d="M-40 108 C 380 108, 780 250, 1244 250" stroke="url(#blue)" stroke-opacity="0.2" stroke-width="13" filter="url(#glow)"/>
    <path d="M-40 250 C 380 236, 760 264, 1244 250" stroke="url(#green)" stroke-opacity="0.22" stroke-width="14" filter="url(#glow)"/>
    <path d="M-40 392 C 380 392, 780 250, 1244 250" stroke="url(#violet)" stroke-opacity="0.2" stroke-width="13" filter="url(#glow)"/>

    <path d="M-40 108 C 380 108, 780 250, 1244 250" stroke="url(#blue)" stroke-width="3"/>
    <path d="M-40 250 C 380 236, 760 264, 1244 250" stroke="url(#green)" stroke-width="3.2"/>
    <path d="M-40 392 C 380 392, 780 250, 1244 250" stroke="url(#violet)" stroke-width="3"/>
    <path d="M1246 250 L 1640 250" stroke="url(#out)" stroke-width="2.4"/>
  </g>

  <g filter="url(#soft)">
    <circle cx="214" cy="108" r="3.6" fill="#93c5fd"/>
    <circle cx="486" cy="108" r="2.6" fill="#bfdbfe" opacity="0.85"/>
    <circle cx="806" cy="146" r="3.2" fill="#a5c8ff"/>
    <circle cx="1042" cy="203" r="2.4" fill="#cbdfff" opacity="0.8"/>

    <circle cx="318" cy="250" r="3.6" fill="#6ee7b7"/>
    <circle cx="642" cy="250" r="2.6" fill="#bbf7d0" opacity="0.85"/>
    <circle cx="968" cy="250" r="3.2" fill="#8ef0cd"/>

    <circle cx="252" cy="392" r="3.6" fill="#c4b5fd"/>
    <circle cx="548" cy="392" r="2.6" fill="#ddd6fe" opacity="0.85"/>
    <circle cx="864" cy="330" r="3.2" fill="#cbb8ff"/>
    <circle cx="1088" cy="278" r="2.4" fill="#e3d9ff" opacity="0.8"/>
  </g>

  <g fill="none" stroke-linecap="round" opacity="0.55">
    <path d="M180 84 h18 M189 75 v18" stroke="#4dabf7" stroke-opacity="0.5" stroke-width="1.6"/>
    <path d="M1360 158 h14 M1367 151 v14" stroke="#8ab4ff" stroke-opacity="0.35" stroke-width="1.4"/>
    <path d="M1470 330 h16 M1478 322 v16" stroke="#34d399" stroke-opacity="0.3" stroke-width="1.4"/>
    <path d="M300 430 h14 M307 423 v14" stroke="#a78bfa" stroke-opacity="0.4" stroke-width="1.4"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="1250" cy="250" r="6.5" fill="#f2f7ff"/>
    <circle cx="1250" cy="250" r="18" fill="none" stroke="#dbe8ff" stroke-opacity="0.32" stroke-width="1.6"/>
    <circle cx="1250" cy="250" r="34" fill="none" stroke="#dbe8ff" stroke-opacity="0.14" stroke-width="1.2"/>
    <circle cx="1250" cy="250" r="56" fill="none" stroke="#dbe8ff" stroke-opacity="0.07" stroke-width="1"/>
  </g>

  <rect x="0" y="0" width="1600" height="500" fill="none" stroke="#22304a" stroke-opacity="0.6" stroke-width="1"/>
</svg>
