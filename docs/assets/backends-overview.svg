    <clipPath id="clipCard1"><rect x="40" y="84" width="484" height="316" rx="14"/></clipPath>
    <clipPath id="clipCard2"><rect x="558" y="84" width="484" height="316" rx="14"/></clipPath>
    <clipPath id="clipCard3"><rect x="1076" y="84" width="484" height="316" rx="14"/></clipPath>

    <style>
