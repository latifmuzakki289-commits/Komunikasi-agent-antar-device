      <text x="51" y="20" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#ddd6fe">Streaming</text>

      <rect x="112" width="162" height="30" rx="7" fill="#1d1636" stroke="#453375" stroke-width="1"/>
      <text x="193" y="20" text-anchor="middle" class="mono" font-size="12.5" font-weight="600" fill="#ddd6fe">reasoning_content</text>

      <rect x="284" width="102" height="30" rx="7" fill="#1d1636" stroke="#453375" stroke-width="1"/>
      <text x="335" y="20" text-anchor="middle" class="sans" font-size="13" font-weight="600" fill="#ddd6fe">Userscript</text>
