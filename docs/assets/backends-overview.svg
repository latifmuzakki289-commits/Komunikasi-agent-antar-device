    </pattern>

    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f182e" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#0a1122" stop-opacity="0.96"/>
    </linearGradient>

    <radialGradient id="glowBlue" cx="0.2" cy="0.0" r="0.85">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowGreen" cx="0.2" cy="0.0" r="0.85">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowViolet" cx="0.2" cy="0.0" r="0.85">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="barBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="0.6" stop-color="#4dabf7"/>
      <stop offset="1" stop-color="#9cc4ff" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="0.6" stop-color="#34d399"/>
      <stop offset="1" stop-color="#a7f3d0" stop-opacity="0.35"/>
    </linearGradient>

    <linearGradient id="barViolet" x1="0" y1="0" x2="1" y2="0">
